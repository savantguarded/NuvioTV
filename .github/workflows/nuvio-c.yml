# Nuvio C: official NuvioTV releases + the Nuvio C commits on this branch.
#
# Every hour it asks: has NuvioMedia/NuvioTV published a new release (betas included)?
# If not, it stops in seconds. If yes:
#   1. fetches the code of exactly that official release
#   2. replays this branch's own commits on top of it (locally, nothing is pushed)
#   3. applies build-time branding (name "Nuvio C", separate package id, updater reads this repo)
#   4. builds a signed armeabi-v7a release APK and publishes it as a GitHub release
#
# A run is skipped when that release was already built (unless forced).
# You get a GitHub notification (an issue on this repo) when:
#   - upstream changed any of the OSD code this fork modifies (build still runs), or
#   - upstream conflicts with the core changes (OSD/Simkl: build stops; last good APK stays), or
#   - upstream conflicts with, or breaks, the optional background-trailer patch (the APK is
#     still built and published, just without background trailers).

name: Nuvio C build

on:
  schedule:
    - cron: "23 * * * *" # hourly, at :23 past (avoids the busy top of the hour)
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this official release was already built
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: nuvio-c-build
  cancel-in-progress: false

env:
  UPSTREAM_SLUG: NuvioMedia/NuvioTV
  UPSTREAM_REPO: https://github.com/NuvioMedia/NuvioTV.git
  # Branch the Nuvio C commits were written on top of; used only to find them.
  UPSTREAM_BRANCH: dev
  APP_NAME: Nuvio C
  APP_ID: com.nuvio.tv.c
  ABI: armeabi-v7a
  # Code the fork changes. Upstream edits here trigger a heads-up issue.
  OSD_FILES: >-
    app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerScreen.kt
    app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerMetadata.kt
  OSD_FUNCTIONS: PlayerControlsOverlay|ProgressBar|SeekOverlay|PlayerControlsProgressBarHost|applyMetaDetails
  # Background trailers (upstream PR #3730 + Nuvio C layer). Applied as a separate, optional patch:
  # if an official release conflicts with it, or the app won't compile with it, the build carries
  # on without it (official trailer behaviour) and opens an issue. Everything else is the core patch.
  TRAILER_PATHS: >-
    app/src/main/java/com/nuvio/tv/ui/screens/detail
    app/src/main/java/com/nuvio/tv/ui/components/TrailerPlayer.kt
    app/src/main/java/com/nuvio/tv/ui/components/NuvioCTrailerFraming.kt
    app/src/main/java/com/nuvio/tv/data/local/TrailerSettingsDataStore.kt
    app/src/main/java/com/nuvio/tv/ui/screens/settings/LayoutDetailSettings.kt
    app/src/main/java/com/nuvio/tv/ui/screens/settings/LayoutSettingsViewModel.kt
    app/src/main/res/values/strings_nuvio_c_trailer.xml
    app/src/main/res/values-fr/strings_nuvio_c_trailer.xml

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # gh must target this fork, never the upstream remote added below
      GH_REPO: ${{ github.repository }}
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES || secrets.LOCAL_PROPERTIES_BASE64 }}
      KEYSTORE_BASE64: ${{ secrets.NUVIO_C_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.NUVIO_C_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.NUVIO_C_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.NUVIO_C_STORE_PASSWORD }}

    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream and decide whether to build
        id: plan
        run: |
          set -euo pipefail
          # Newest published official release, pre-releases included (drafts never are public)
          release="$(gh api "repos/${UPSTREAM_SLUG}/releases?per_page=20" \
            --jq '[.[] | select(.draft | not)] | sort_by(.published_at) | last | .tag_name // ""')"
          if [ -z "$release" ]; then
            echo "::error::Could not read the official release list."
            exit 1
          fi
          echo "Newest official release: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          # "+nuvioc" is semver build metadata: the in-app updater reads it as the official version
          # (so it can compare), and it never clashes with the official tags this fork carries.
          tag="${release}+nuvioc"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "Already built for $release. Nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git fetch --no-tags upstream "refs/tags/${release}:refs/nuvio/release"
          upstream_sha="$(git rev-parse --short=7 'refs/nuvio/release^{commit}')"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether upstream touched the OSD code
        id: osd
        if: steps.plan.outputs.build == 'true'
        run: |
          last_tag="$(gh release list --limit 50 --json tagName,createdAt \
            --jq '[.[] | select((.tagName | startswith("c-")) or (.tagName | endswith("+nuvioc")))] | sort_by(.createdAt) | last | .tagName // ""')"
          last_ref="${last_tag#c-}"; last_ref="${last_ref%+nuvioc}"
          last_sha=""
          if [ -n "$last_ref" ]; then
            # Older builds were tagged by commit, newer ones by official release tag
            if git fetch --no-tags upstream "refs/tags/${last_ref}:refs/nuvio/previous" 2>/dev/null; then
              last_sha="$(git rev-parse --short=7 'refs/nuvio/previous^{commit}')"
            elif git cat-file -e "${last_ref}^{commit}" 2>/dev/null; then
              last_sha="$last_ref"
            fi
          fi
          if [ -z "$last_sha" ]; then
            echo "No previous build to compare against."
            exit 0
          fi
          hits="$(git diff -U0 "$last_sha" refs/nuvio/release -- $OSD_FILES | grep -E '^@@' | grep -E "$OSD_FUNCTIONS" || true)"
          if [ -n "$hits" ]; then
            {
              echo "Upstream changed OSD code that Nuvio C also modifies, between \`${last_ref}\` and \`${{ steps.plan.outputs.release }}\`."
              echo
              echo "The build still ran. Check the new APK's player screen looks right."
              echo
              echo "Upstream changes: https://github.com/NuvioMedia/NuvioTV/compare/${last_sha}...${{ steps.plan.outputs.upstream_sha }}"
              echo
              echo '```'
              echo "$hits"
              echo '```'
            } > osd-notice.md
            echo "notice=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replay Nuvio C commits onto the official release
        id: replay
        if: steps.plan.outputs.build == 'true'
        run: |
          git config user.name "nuvio-c-bot"
          git config user.email "nuvio-c-bot@users.noreply.github.com"
          read -ra trailer_paths <<< "$TRAILER_PATHS"
          exclude=()
          for p in "${trailer_paths[@]}"; do exclude+=(":(exclude)$p"); done
          # Our changes = this branch vs the upstream commit it sits on, split into core + trailer
          base="$(git merge-base HEAD upstream/$UPSTREAM_BRANCH)"
          echo "Nuvio C commits (applied onto ${{ steps.plan.outputs.release }}):"
          git log --oneline "$base..HEAD"
          git diff --binary "$base" HEAD -- . "${exclude[@]}" > "$RUNNER_TEMP/nuvio-c.patch"
          git diff --binary "$base" HEAD -- "${trailer_paths[@]}" > "$RUNNER_TEMP/nuvio-c-trailer.patch"
          echo "Core patch:"; git diff --stat "$base" HEAD -- . "${exclude[@]}"
          echo "Trailer patch:"; git diff --stat "$base" HEAD -- "${trailer_paths[@]}"
          git checkout -q --detach refs/nuvio/release
          if ! git apply --3way --index "$RUNNER_TEMP/nuvio-c.patch"; then
            git reset -q --hard
            gh issue create --title "Nuvio C: official ${{ steps.plan.outputs.release }} conflicts with the OSD changes" \
              --body "Official release ${{ steps.plan.outputs.release }} edited the same lines as the Nuvio C commits, so this build stopped. The last good APK is still in Releases. The patch needs refreshing." || true
            echo "::error::Upstream changed the same code as the Nuvio C commits. The patch needs a manual refresh."
            exit 1
          fi
          git commit -q --no-verify -m "Nuvio C core"
          # Optional trailer patch: a conflict only drops the feature, never the update
          trailer="skipped"
          if [ ! -s "$RUNNER_TEMP/nuvio-c-trailer.patch" ]; then
            trailer="none"
          elif git apply --3way --index "$RUNNER_TEMP/nuvio-c-trailer.patch"; then
            git commit -q --no-verify -m "Nuvio C background trailers"
            git diff --binary HEAD~1 HEAD > "$RUNNER_TEMP/nuvio-c-trailer-applied.patch"
            trailer="applied"
            changed="$(git diff --name-only "$base" refs/nuvio/release -- "${trailer_paths[@]}" || true)"
            if [ -n "$changed" ]; then
              {
                echo "Official ${{ steps.plan.outputs.release }} changed files the background-trailer feature also edits. It still merged and built, but check the detail page on the TV."
                echo
                echo '```'
                echo "$changed"
                echo '```'
              } > trailer-notice.md
            fi
          else
            git reset -q --hard
            {
              echo "Official ${{ steps.plan.outputs.release }} conflicts with the background-trailer patch, so this build was made **without** background trailers (official trailer behaviour). Everything else is in."
              echo
              echo "The trailer patch needs refreshing. If official has merged PR #3730, the fork's copy can be removed instead."
            } > trailer-notice.md
          fi
          echo "Background trailers: $trailer"
          echo "trailer=$trailer" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        if: steps.plan.outputs.build == 'true'
        run: |
          missing=()
          for s in LOCAL_PROPERTIES KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Apply Nuvio C branding (build-time only)
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          # Launcher name in every locale
          find app/src -path '*/res/values*/*.xml' -print0 \
            | xargs -0 sed -i -E "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">${APP_NAME}</string>#"
          # Separate package id so it installs alongside the official app
          grep -q 'applicationId = "com.nuvio.tv"' app/build.gradle.kts
          sed -i -E "s#applicationId = \"com.nuvio.tv\"#applicationId = \"${APP_ID}\"#" app/build.gradle.kts
          # In-app updater checks this repo's releases (Nuvio C APKs), not the official ones
          grep -q '"GITHUB_OWNER", "\\"NuvioMedia\\""' app/build.gradle.kts
          sed -i -E "s#(\"GITHUB_OWNER\", \"\\\\\")[^\\\\]*#\\1${GITHUB_REPOSITORY%%/*}#" app/build.gradle.kts
          sed -i -E "s#(\"GITHUB_REPO\", \"\\\\\")[^\\\\]*#\\1${GITHUB_REPOSITORY#*/}#" app/build.gradle.kts
          grep -n 'GITHUB_OWNER\|GITHUB_REPO' app/build.gradle.kts
          # Only the ABI the TV needs, no universal APK
          sed -i -E "s#include\(\"armeabi-v7a\"[^)]*\)#include(\"${ABI}\")#" app/build.gradle.kts
          sed -i -E 's#isUniversalApk = true#isUniversalApk = false#' app/build.gradle.kts
          echo "Branding diff:"; git --no-pager diff --stat

      - name: Prepare local.properties and signing
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          # Secret may be plain text or base64; accept either.
          if printf '%s' "$LOCAL_PROPERTIES" | grep -qE '^[[:space:]]*[A-Z_]+[[:space:]]*='; then
            printf '%s\n' "$LOCAL_PROPERTIES" > local.properties
          else
            printf '%s' "$LOCAL_PROPERTIES" | tr -d '[:space:]' | base64 --decode > local.properties
          fi
          # Sanity check without printing any values (key names only)
          echo "Key names found in the secret:"
          grep -oE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=' local.properties | tr -d ' =' | sed 's/^/  /' || true
          for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID TMDB_API_KEY; do
            if grep -qE "^[[:space:]]*${k}[[:space:]]*=[[:space:]]*[^[:space:]]" local.properties; then
              echo "local.properties: $k set"
            else
              echo "::warning::local.properties: $k is empty or missing"
            fi
          done
          touch local.dev.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuvio-c.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuvio-c.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.plan.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: apk
        if: steps.plan.outputs.build == 'true'
        run: |
          trailer="${{ steps.replay.outputs.trailer }}"
          if ./gradlew :app:assembleFullRelease --stacktrace; then
            echo "trailer=$trailer" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$trailer" = "applied" ] || exit 1
          # The trailer patch merged but no longer compiles against this release: drop it and retry
          echo "::warning::Build failed with background trailers; retrying without them."
          git apply -R "$RUNNER_TEMP/nuvio-c-trailer-applied.patch"
          {
            echo "Official ${{ steps.plan.outputs.release }} merged with the background-trailer patch but the app didn't compile with it, so this build was made **without** background trailers (official trailer behaviour). Everything else is in."
            echo
            echo "See the failed first attempt in the build log. The trailer patch needs refreshing."
          } > trailer-notice.md
          ./gradlew :app:assembleFullRelease --stacktrace
          echo "trailer=build-failed" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/full/release -name "*${ABI}*.apk" | head -1)"
          [ -n "$apk" ] || { echo "::error::No ${ABI} APK produced"; exit 1; }
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          out="NuvioC-${version}-${ABI}.apk"
          cp "$apk" "$out"
          tag="${{ steps.plan.outputs.tag }}"
          gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          rel="${{ steps.plan.outputs.release }}"
          notes="Nuvio C, built from official NuvioTV release [${rel}](https://github.com/${UPSTREAM_SLUG}/releases/tag/${rel}) (commit ${{ steps.plan.outputs.upstream_sha }}) plus the Nuvio C player tweaks."
          if [ "${{ steps.apk.outputs.trailer }}" = "applied" ]; then
            notes="${notes} Background trailers included."
          else
            notes="${notes} Background trailers NOT included in this build (see issues)."
          fi
          gh release create "$tag" "$out" --target "$GITHUB_SHA" \
            --title "Nuvio C ${rel}" \
            --notes "$notes" --latest
          # Keep the 5 newest Nuvio C releases
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select((.tagName | startswith("c-")) or (.tagName | endswith("+nuvioc")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Send OSD heads-up
        if: steps.osd.outputs.notice == 'true'
        run: |
          if ! gh issue create --title "Nuvio C: official ${{ steps.plan.outputs.release }} changed player code" --body-file osd-notice.md; then
            cat osd-notice.md
            echo "::error::Could not open the heads-up issue (are Issues enabled on this repo?)."
            exit 1
          fi

      - name: Send background-trailer notice
        if: success() && steps.plan.outputs.build == 'true' && hashFiles('trailer-notice.md') != ''
        run: |
          if [ "${{ steps.apk.outputs.trailer }}" = "applied" ]; then
            title="Nuvio C: official ${{ steps.plan.outputs.release }} changed detail-page code (background trailers still in)"
          else
            title="Nuvio C: ${{ steps.plan.outputs.release }} built without background trailers"
          fi
          gh issue create --title "$title" --body-file trailer-notice.md || cat trailer-notice.md
